# The code half of the sweep: video retention (R2), installment reminders and
# the spam purge. Hourly, not every fifteen minutes.
#
# Every call is a serverless invocation, and on a plan where Active CPU is the
# scarce resource, ninety-six cold starts a day for a run that usually has
# nothing to do was the wrong trade. The jobs that must be tight — cancelling
# abandoned checkouts so a coupon and a pack seat come back — now run inside
# Postgres, on pg_cron, with no function invocation and no egress at all (see
# supabase/cron.sql). What is left here can wait an hour: a retention sweep,
# a reminder, a purge.
#
# Vercel's Hobby plan refuses any cron more frequent than once a day — a
# `*/15` expression does not merely get throttled, it FAILS THE DEPLOYMENT —
# so vercel.json keeps its daily run and this workflow drives the cadence.
#
# Needs two repository secrets; without them the job exits cleanly rather than
# failing the run, so a fork or a fresh clone is never red for missing config:
#   SWEEP_URL     https://<your-domain>/api/cron/sweep
#   CRON_SECRET   the same value set in the Vercel project
name: Sweep

on:
  schedule:
    # Hourly. GitHub queues scheduled runs, so treat this as "about hourly"
    # rather than a guarantee.
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Call the sweep endpoint
        env:
          SWEEP_URL: ${{ secrets.SWEEP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SWEEP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SWEEP_URL or CRON_SECRET is not set — skipping."
            exit 0
          fi
          code=$(curl -sS -o /tmp/sweep.out -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" "$SWEEP_URL")
          echo "HTTP $code"
          cat /tmp/sweep.out
          echo
          # The endpoint answers 401 without the secret and 503 before the
          # database is wired up; neither is worth waking anyone at 3am.
          if [ "$code" != "200" ]; then
            echo "::warning::sweep returned HTTP $code"
          fi
